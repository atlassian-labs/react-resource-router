<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Network nodes representing routes and resources -->
  <g>
    <!-- Central router node -->
    <circle cx="60" cy="60" r="12" fill="#FF5630"/>
    
    <!-- Route nodes -->
    <circle cx="30" cy="30" r="6" fill="#0052CC"/>
    <circle cx="90" cy="30" r="6" fill="#0052CC"/>
    <circle cx="30" cy="90" r="6" fill="#0052CC"/>
    <circle cx="90" cy="90" r="6" fill="#0052CC"/>
    
    <!-- Resource nodes -->
    <circle cx="60" cy="25" r="4" fill="#0052CC" opacity="0.7"/>
    <circle cx="95" cy="60" r="4" fill="#0052CC" opacity="0.7"/>
    <circle cx="60" cy="95" r="4" fill="#0052CC" opacity="0.7"/>
    <circle cx="25" cy="60" r="4" fill="#0052CC" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="60" y1="60" x2="30" y2="30" stroke="#0052CC" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="60" x2="90" y2="30" stroke="#0052CC" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="60" x2="30" y2="90" stroke="#0052CC" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="60" x2="90" y2="90" stroke="#0052CC" stroke-width="2" opacity="0.6"/>
    
    <!-- Resource connections -->
    <line x1="60" y1="48" x2="60" y2="25" stroke="#FF5630" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="72" y1="60" x2="95" y2="60" stroke="#FF5630" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="60" y1="72" x2="60" y2="95" stroke="#FF5630" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="48" y1="60" x2="25" y2="60" stroke="#FF5630" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Data flow animation indicators -->
    <circle cx="45" cy="45" r="2" fill="#FF5630" opacity="0.8"/>
    <circle cx="75" cy="45" r="2" fill="#FF5630" opacity="0.6"/>
    <circle cx="75" cy="75" r="2" fill="#FF5630" opacity="0.8"/>
    <circle cx="45" cy="75" r="2" fill="#FF5630" opacity="0.6"/>
  </g>
  
  <!-- Outer ring suggesting routing boundary -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#E3E8F0" stroke-width="1" opacity="0.5"/>
</svg>