<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo 3: Progressive Rendering - Layered elements suggesting progressive loading -->
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5630;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4C9AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Progressive layers -->
  <rect x="30" y="30" width="60" height="60" rx="8" fill="#0052CC" opacity="0.2"/>
  <rect x="35" y="35" width="50" height="50" rx="6" fill="#4C9AFF" opacity="0.4"/>
  <rect x="40" y="40" width="40" height="40" rx="4" fill="#0052CC" opacity="0.6"/>
  <rect x="45" y="45" width="30" height="30" rx="3" fill="#4C9AFF" opacity="0.8"/>
  <rect x="50" y="50" width="20" height="20" rx="2" fill="#FF5630"/>
  
  <!-- Route indicators -->
  <path d="M15 60 L30 60" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 60 L105 60" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 15 L60 30" stroke="#4C9AFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 90 L60 105" stroke="#4C9AFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Connection points -->
  <circle cx="15" cy="60" r="3" fill="#0052CC"/>
  <circle cx="105" cy="60" r="3" fill="#0052CC"/>
  <circle cx="60" cy="15" r="3" fill="#4C9AFF"/>
  <circle cx="60" cy="105" r="3" fill="#4C9AFF"/>
</svg>