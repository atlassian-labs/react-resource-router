<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Logo 3: Abstract Route Tree -->
  <defs>
    <radialGradient id="gradient3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#36B37E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main route trunk -->
  <path d="M 100 180 L 100 120" stroke="#0052CC" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Route branches -->
  <path d="M 100 120 L 70 90" stroke="#0052CC" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 120 L 130 90" stroke="#0052CC" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 140 L 80 110" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 140 L 120 110" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Resource endpoints -->
  <circle cx="70" cy="90" r="8" fill="url(#gradient3)"/>
  <circle cx="130" cy="90" r="8" fill="url(#gradient3)"/>
  <circle cx="80" cy="110" r="6" fill="#36B37E"/>
  <circle cx="120" cy="110" r="6" fill="#36B37E"/>
  
  <!-- Router core -->
  <circle cx="100" cy="120" r="12" fill="#0052CC"/>
  <circle cx="100" cy="120" r="6" fill="#ffffff"/>
  
  <!-- Data flow particles -->
  <circle cx="85" cy="105" r="1.5" fill="#36B37E" opacity="0.8"/>
  <circle cx="115" cy="105" r="1.5" fill="#36B37E" opacity="0.8"/>
  <circle cx="75" cy="95" r="1.5" fill="#36B37E" opacity="0.6"/>
  <circle cx="125" cy="95" r="1.5" fill="#36B37E" opacity="0.6"/>
</svg>