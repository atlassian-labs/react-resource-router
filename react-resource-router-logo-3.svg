<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Performance-focused design: Progressive loading and speed -->
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5630;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFAB00;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#36B37E;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2684FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Progressive loading layers -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#speedGradient)" stroke-width="2" opacity="0.4"/>
  <circle cx="60" cy="60" r="35" fill="none" stroke="url(#speedGradient)" stroke-width="3" opacity="0.6"/>
  <circle cx="60" cy="60" r="25" fill="none" stroke="url(#speedGradient)" stroke-width="4" opacity="0.8"/>
  
  <!-- Speed lines -->
  <path d="M25 45 L35 45" stroke="#36B37E" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 60 L35 60" stroke="#36B37E" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 75 L35 75" stroke="#36B37E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central router core -->
  <circle cx="60" cy="60" r="12" fill="url(#coreGradient)"/>
  
  <!-- Route indicators -->
  <circle cx="60" cy="35" r="3" fill="#36B37E"/>
  <circle cx="85" cy="60" r="3" fill="#36B37E"/>
  <circle cx="60" cy="85" r="3" fill="#36B37E"/>
  <circle cx="35" cy="60" r="3" fill="#36B37E"/>
</svg>