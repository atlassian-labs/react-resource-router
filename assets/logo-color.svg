  <ellipse cx="120" cy="120" rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(30,120,120)"/>
  <ellipse cx="120" cy="120" rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(150,120,120)"/>
  <ellipse cx="120" cy="120" rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(270,120,120)"/>
  
  <!-- Router path arrows -->
  <path d="M80,120 L160,120 L140,100 M140,140 L160,120" fill="none" stroke="#0052CC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Resource cube -->
