<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Route-focused design: Intersecting paths representing routing -->
  <defs>
    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2684FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main routing paths -->
  <path d="M20 60 Q40 20, 60 60 Q80 100, 100 60" 
        stroke="url(#routeGradient)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"/>
  
  <path d="M60 20 Q100 40, 60 60 Q20 80, 60 100" 
        stroke="#36B37E" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Route nodes -->
  <circle cx="60" cy="60" r="8" fill="#FFFFFF" stroke="url(#routeGradient)" stroke-width="3"/>
  <circle cx="30" cy="45" r="5" fill="#36B37E"/>
  <circle cx="90" cy="75" r="5" fill="#36B37E"/>
  <circle cx="45" cy="85" r="5" fill="#2684FF"/>
  <circle cx="75" cy="35" r="5" fill="#2684FF"/>
</svg>