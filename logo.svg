<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="90" fill="#0052CC" opacity="0.1"/>
    
    <!-- React-like orbital rings -->
    <ellipse cx="100" cy="100" rx="70" ry="25" stroke="#0052CC" fill="none" stroke-width="2" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="100" rx="70" ry="25" stroke="#0052CC" fill="none" stroke-width="2" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="70" ry="25" stroke="#0052CC" fill="none" stroke-width="2" transform="rotate(120 100 100)"/>
    
    <!-- Central router hub -->
    <circle cx="100" cy="100" r="15" fill="#0052CC"/>
    
    <!-- Resource dots -->
    <circle cx="150" cy="70" r="8" fill="#36B37E"/>
    <circle cx="50" cy="130" r="8" fill="#FF5630"/>
    <circle cx="150" cy="130" r="8" fill="#00B8D9"/>
    
    <!-- Connection lines -->
    <path d="M 100 100 L 150 70" stroke="#0052CC" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 100 100 L 50 130" stroke="#0052CC" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 100 100 L 150 130" stroke="#0052CC" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Progressive loading arc -->
    <path d="M 100 30 A 70 70 0 0 1 170 100" stroke="#FFAB00" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>