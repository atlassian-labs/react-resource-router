<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Performance-focused design: Speed and efficiency -->
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5630;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2684FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#36B37E;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2684FF;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Speed/performance arcs -->
  <path d="M30 60 A30 30 0 0 1 90 60" 
        stroke="url(#speedGradient)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"/>
  
  <path d="M25 60 A35 35 0 0 1 95 60" 
        stroke="url(#speedGradient)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <path d="M20 60 A40 40 0 0 1 100 60" 
        stroke="url(#speedGradient)" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.3"/>
  
  <!-- Central router core -->
  <circle cx="60" cy="60" r="12" fill="url(#centerGradient)" stroke="#0052CC" stroke-width="2"/>
  
  <!-- Performance indicators -->
  <polygon points="60,48 66,54 60,60 54,54" fill="#36B37E"/>
  
  <!-- Route endpoints -->
  <circle cx="30" cy="60" r="4" fill="#2684FF"/>
  <circle cx="90" cy="60" r="4" fill="#36B37E"/>
  
  <!-- Speed lines -->
  <line x1="35" y1="55" x2="45" y2="50" stroke="#36B37E" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="65" x2="45" y2="70" stroke="#36B37E" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="85" y2="55" stroke="#2684FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="70" x2="85" y2="65" stroke="#2684FF" stroke-width="2" stroke-linecap="round"/>
</svg>