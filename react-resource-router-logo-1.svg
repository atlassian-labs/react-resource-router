<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Path-focused design: Connected nodes representing routes -->
  <defs>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2684FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main routing paths -->
  <path d="M20 60 Q40 30 60 60 Q80 90 100 60" stroke="url(#pathGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M60 20 Q30 40 60 60 Q90 80 60 100" stroke="url(#pathGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Route nodes -->
  <circle cx="20" cy="60" r="6" fill="#2684FF"/>
  <circle cx="60" cy="20" r="6" fill="#2684FF"/>
  <circle cx="100" cy="60" r="6" fill="#2684FF"/>
  <circle cx="60" cy="100" r="6" fill="#2684FF"/>
  
  <!-- Central hub (main router) -->
  <circle cx="60" cy="60" r="8" fill="#0052CC"/>
  <circle cx="60" cy="60" r="4" fill="white"/>
</svg>